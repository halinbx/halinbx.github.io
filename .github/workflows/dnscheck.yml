name: DNS Cert Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dnscheck.yml"
      - "TRIGGER_DNSCHECK"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DNS deep check (mimic Bingbot path)
        run: |
          OUT=.github/dnscheck_result.txt
          {
          echo "DNS Deep Check @ $(date -u '+%Y-%m-%d %H:%M UTC') from GitHub Actions runner"
          echo

          echo "===== 1. Recursive (runner default resolver) ====="
          echo "-- A --";    dig +short owntools.cn A
          echo "-- AAAA --"; dig +short owntools.cn AAAA
          echo "-- NS --";   dig +short owntools.cn NS

          echo
          echo "===== 2. Delegation chain: root -> cn -> owntools.cn (dig +trace) ====="
          dig +trace +nodnssec owntools.cn A 2>&1 | grep -E '(^owntools|^cn\.|server can|received|resolution|;; SERVER|;; Query time|connection|timed out)' | head -40

          echo
          echo "===== 3. .cn TLD servers view (is delegation visible?) ====="
          for ns in a.dns.cn c.dns.cn e.dns.cn g.dns.cn; do
            echo "-- @$ns NS --"
            dig +time=5 +tries=1 +short @$ns owntools.cn NS 2>&1 | head -6
          done

          echo
          echo "===== 4. Authoritative hichina: UDP x3, timing ====="
          for i in 1 2 3; do
            dig +time=5 +tries=1 @dns17.hichina.com owntools.cn A 2>&1 | grep -E '(status|Query time|SERVER|timed out|refused|no servers)' 
            echo "--"
          done
          for i in 1 2 3; do
            dig +time=5 +tries=1 @dns18.hichina.com owntools.cn A 2>&1 | grep -E '(status|Query time|SERVER|timed out|refused|no servers)'
            echo "--"
          done

          echo
          echo "===== 5. Authoritative via TCP (Bing fallback path) ====="
          dig +tcp +time=5 +tries=1 @dns17.hichina.com owntools.cn A 2>&1 | grep -E '(status|Query time|SERVER|timed out|connection)' 
          dig +tcp +time=5 +tries=1 @dns18.hichina.com owntools.cn A 2>&1 | grep -E '(status|Query time|SERVER|timed out|connection)'

          echo
          echo "===== 6. EDNS probe (some auth servers drop EDNS) ====="
          dig +edns=0 +noednsneg +time=5 +tries=1 @dns17.hichina.com owntools.cn A 2>&1 | grep -E '(status|Query time|edns|flags|timed out)'
          dig +noedns +time=5 +tries=1 @dns17.hichina.com owntools.cn A 2>&1 | grep -E '(status|Query time|flags|timed out)'

          echo
          echo "===== 7. Public DoH views ====="
          curl -s --max-time 15 "https://dns.google/resolve?name=owntools.cn&type=A"; echo
          curl -s --max-time 15 -H "accept: application/dns-json" "https://cloudflare-dns.com/dns-query?name=owntools.cn&type=A"; echo
          curl -s --max-time 15 "https://dns.google/resolve?name=owntools.cn&type=NS"; echo

          echo
          echo "===== 8. CAA + HTTPS fetch sanity ====="
          dig +short owntools.cn CAA
          echo | timeout 20 openssl s_client -connect owntools.cn:443 -servername owntools.cn 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName || echo "TLS FAIL"
          curl -sI --max-time 20 https://owntools.cn/ | head -5
          } | tee "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dnscheck_result.txt
          git diff --cached --quiet && echo "no changes" || (git commit -m "chore: dnscheck result [skip ci]" && git push)
</task_progress>
</write_to_file>