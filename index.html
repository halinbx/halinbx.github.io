  <!-- 今日访问统计(Abacus 免费计数服务,无需注册,CORS 开放):
       计数 key 带当日日期(如 pv-20260824),每天自动从 0 开始;
       今日访客按设备去重(localStorage 标记,同一浏览器当天只计 1 次)。
       仅统计访问次数,不采集任何工具输入内容 -->
  <script>
    (function () {
      var box = document.getElementById("stat-today");
      if (!box) return;
      var d = new Date();
      var day = d.getFullYear()
        + String(d.getMonth() + 1).padStart(2, "0")
        + String(d.getDate()).padStart(2, "0");
      var API = "https://abacus.jasoncameron.dev/hit/halinbx-testgo/";
      function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      function show(pv, uv) {
        box.style.display = "inline";
        box.textContent = "今日访问 " + pv + " 次 · 今日访客 " + uv + " 人";
      }

      fetch(API + "pv-" + day)
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var pv = j.value;
          if (lsGet("tg_uv_day") === day) {
            show(pv, lsGet("tg_uv_val") || 1); // 本机今天已计入,读缓存,避免重复累计
          } else {
            fetch(API + "uv-" + day)
              .then(function (r) { return r.json(); })
              .then(function (j2) {
                lsSet("tg_uv_day", day);
                lsSet("tg_uv_val", j2.value);
                show(pv, j2.value);
              })
              .catch(function () { show(pv, "-"); });
          }
        })
        .catch(function () {
          box.style.display = "inline";
          box.textContent = "统计服务暂不可用";
        });
    })();
  </script>
