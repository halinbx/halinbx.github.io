  <script>
    (function () {
      var box = document.getElementById("stat-today");
      if (!box) return;
      var d = new Date();
      var day = d.getFullYear()
        + String(d.getMonth() + 1).padStart(2, "0")
        + String(d.getDate()).padStart(2, "0");
      var API = "https://abacus.jasoncameron.dev/hit/halinbx-testgo/";
      function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      var BASE_PV = 1314;
      var BASE_UV = 1134;
      function show(pv, uv) {
        box.style.display = "inline";
        var uvNum = parseInt(uv, 10);
        var uvShow = isNaN(uvNum) ? "-" : (BASE_UV + uvNum - 1);
        box.textContent = "今日访问 " + (BASE_PV + pv) + " 人次 · 今日访客 " + uvShow + " 人";
      }

      fetch(API + "pv-" + day)
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var pv = j.value;
          if (lsGet("tg_uv_day") === day) {
            show(pv, lsGet("tg_uv_val") || 1);
          } else {
            fetch(API + "uv-" + day)
              .then(function (r) { return r.json(); })
              .then(function (j2) {
                lsSet("tg_uv_day", day);
                lsSet("tg_uv_val", j2.value);
                show(pv, j2.value);
              })
              .catch(function () { show(pv, "-"); });
          }
        })
        .catch(function () {
          box.style.display = "inline";
          box.textContent = "统计服务暂不可用";
        });
    })();
  </script>
